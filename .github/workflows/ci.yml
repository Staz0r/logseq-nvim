name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check committed whitespace
        run: git show --check --oneline HEAD

      - name: Check required project documents
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f LICENSE
          test -f docs/ARCHITECTURE.md
          test -f docs/IMPLEMENTATION_PLAN.md
          test -f docs/RESEARCH.md
          test -f docs/ROADMAP.md

      - name: Reject unfilled starter placeholders
        run: |
          if grep -R -n -E --exclude-dir=.git '<<[^>]+>>' .; then
            echo "Unfilled project-starter placeholder found."
            exit 1
          fi

      - name: Explain current test scope
        run: |
          echo "No plugin toolchain exists yet."
          echo "Phase 1 must add Lua adapter tests and headless Neovim tests."
